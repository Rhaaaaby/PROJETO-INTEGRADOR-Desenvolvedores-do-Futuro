{% extends "partials/navbar.html" %}

{% block title %}Minha Conta{% endblock %}

{% block css_pagina %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/Styleconta.css') }}">
{% endblock %}

{% block content %}

    <form action="{{ url_for('minha_conta.deletar_usuario') }}" method="post" enctype="multipart/form-data" target="_self" autocomplete="on">
  <div class="form">
    <fieldset>
      <legend>
        <span> Bem-vindo(a) de volta! :) </span>
        <p> Aqui você gerencia seus produtos!</p>
      </legend>

      <label for="email"> E-mail ou Usuário: </label>
      <input type="text" id="email" name="email" minlength="3" maxlength="150">

      <label for="senha"> Senha: </label>
      <input type="password" id="senha" name="senha" minlength="6">

      <label for="telefone"> Telefone </label>
      <input type="text" id="telefone" name="telefone" minlength="16">

      <!-- Botões centralizados -->
      <div class="botoes-container">
        <button class="btn-principal">Salvar alterações</button>

        <div class="botoes-duplos">
          <button class="btn-secundario" onclick="location.href='/cadastro_itens'">Cadastrar novos produtos</button>
          <button class="btn-secundario">Ver meus produtos</button>
        </div>

        <button class="btn-excluir" onclick="location.href='/deletar_usuario/{{ User.id }}'">Excluir conta</button>
      </div>

    </fieldset>
  </div>
    </form>
    
{%endblock%}
